{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h1>User profile</h1>
<dl class="details">
  <dt>Username</dt><dd>{{ user['username'] }}</dd>
  <dt>Name</dt><dd>{{ user['full_name'] }}</dd>
  <dt>Email</dt><dd>{{ user['email'] }}</dd>
  <dt>Role</dt><dd>{{ user['role'] }}</dd>
</dl>
{% endblock %}
